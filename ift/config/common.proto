edition = "2023";

package ift.config;

// A list of unicode code points.
message Codepoints {
  repeated uint32 values = 1;
}

// A list of codepoint set ids that reference sets in "EncoderConfig.codepoint_sets"
message SegmentsProto {
  repeated uint32 values = 1;
}

// A list of glyph ids
message Glyphs {
  repeated uint32 values = 1;
}

// Matches when the subset definition intersects codepoints OR features.
message SegmentProto {
  Codepoints codepoints = 1;
  Features features = 2;
}
// A list of open type layout feature tags.
message Features {
  repeated string values = 1;
}

// A variable font design space.
message DesignSpace {
  // Map from axis tag to range on that axis.
  map<string, AxisRangeProto> ranges = 1;
}

message AxisRangeProto {
  float start = 1;
  float end = 2;
}

// Deprecated: unmapped glyph handling is only used by removed closure analysis
// modes. Specifying anything other than FIND_CONDITIONS will result in an
// error.
enum UnmappedGlyphHandling {
  // Deprecated: specifying this value will result in an error.
  PATCH = 0 [deprecated = true];

  // Deprecated: specifying this value will result in an error.
  MOVE_TO_INIT_FONT = 1 [deprecated = true];

  // Default value; triggers no additional behavior in dependency graph
  // condition analysis modes.
  FIND_CONDITIONS = 2;
}